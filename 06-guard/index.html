<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>守卫 GUARD</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#07080d;font-family:"Microsoft YaHei",sans-serif;touch-action:none;user-select:none;-webkit-user-select:none}
  #cv{display:block;position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);image-rendering:pixelated;image-rendering:crisp-edges}
  .overlay{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:24px;text-align:center;z-index:10;background:rgba(7,8,13,.96);color:#e5e7eb}
  .hidden{display:none}
  h1{font-size:40px;margin:0;color:#fff;letter-spacing:2px;text-shadow:0 3px 0 #5b1020}
  .sub{color:#94a3b8;font-size:13px;line-height:1.9}
  .sub b{color:#ff5c85}
  button{padding:14px 40px;font-size:18px;border-radius:14px;border:0;background:#ff0044;color:#fff;font-weight:bold;cursor:pointer}
  button:active{transform:scale(.96)}
  .big{font-size:54px;font-weight:bold;color:#ff5c85}
</style>
</head>
<body>
<canvas id="cv"></canvas>

<div id="start" class="overlay">
  <h1>GUARD!</h1>
  <div class="sub">
    你的好友在走红毯，粉丝从上面冲下来。<br>
    <b>按住</b> = 男保镖（挡蓝粉）<br>
    <b>松开</b> = 女保镖（挡红粉）<br>
    挡错 → 闹出绯闻，这些好友可惨了
  </div>
  <button id="btnStart">开始</button>
</div>

<div id="over" class="overlay hidden">
  <div class="sub">挡住的人数</div>
  <div class="big" id="score">0</div>
  <div class="sub" id="overSub"></div>
  <button id="btnAgain">再来一局</button>
</div>

<script>
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
let GW=210, GH=400, cx, cy, guardY, starY, laneHalf;

// ================= 像素角色 =================
const PAL = {
  skin:'#f2c9a0', hairD:'#2b2b2b', hairBr:'#5c3a1e', hairBk:'#111111',
  suit:'#1b1f2a', suitD:'#0e1118', white:'#ffffff', shoe:'#0a0a0a', eye:'#0a0a0a',
};
function C(k){ return PAL[k] || k; }

function drawCharG(g, spec, walkFrame, coatStage){
  walkFrame = walkFrame||0; coatStage = coatStage||0;
  const S=(x,y,c)=>{g.fillStyle=C(c);g.fillRect(x,y,1,1);};
  const R=(x,y,w,h,c)=>{g.fillStyle=C(c);g.fillRect(x,y,w,h);};
  const E=(a,b,rx,ry,c)=>{g.fillStyle=C(c);for(let y=-ry;y<=ry;y++)for(let x=-rx;x<=rx;x++){if((x*x)/(rx*rx)+(y*y)/(ry*ry)<=1)g.fillRect(a+x,b+y,1,1);}};
  const T=(xT,wT,xB,wB,yT,yB,c)=>{g.fillStyle=C(c);for(let y=yT;y<=yB;y++){const tt=(y-yT)/Math.max(1,yB-yT);g.fillRect(Math.round(xT+(xB-xT)*tt),y,Math.round(wT+(wB-wT)*tt),1);}};

  const hc=spec.hairC||'hairD', oc=spec.oc||'#22c55e';
  const isF=spec.body==='F';
  const legSwing=(walkFrame===1)?1:(walkFrame===3)?-1:0;
  const armSwing=(walkFrame===1)?2:(walkFrame===3)?-2:0;
  const fat=!!spec.fat;

  R(10+legSwing+(fat?-1:0),33,5,12,'suitD');
  R(17-legSwing+(fat?1:0),33,5,12,'suitD');
  R(9+legSwing,44,7,4,'shoe'); R(16-legSwing,44,7,4,'shoe');

  if(spec.outfit==='dress'){ T(9,14,6,20,19,30,oc); T(6,20,3,26,30,40,oc); }
  else if(fat){ T(4,24,3,28,19,36,oc); }
  else { T(8,16,10,12,19,33,oc); }

  if(fat){ R(2,20+armSwing,4,12,oc); R(26,20-armSwing,4,12,oc); R(2,32+armSwing,4,3,'skin'); R(26,32-armSwing,4,3,'skin'); }
  else { R(5,20+armSwing,4,12,oc); R(23,20-armSwing,4,12,oc); R(5,32+armSwing,4,3,'skin'); R(23,32-armSwing,4,3,'skin'); }

  R(14,16,4,4,'skin');
  E(16,10,6,7,'skin');

  const hr=(x,y,w,h)=>{g.fillStyle=C(hc);g.fillRect(x,y,w,h);};
  switch(spec.hair){
    case 'short': hr(10,2,12,4); hr(9,4,2,6); hr(21,4,2,6); break;
    case 'long':  hr(10,2,12,4); hr(8,4,2,14); hr(22,4,2,14); break;
    case 'bun':   hr(10,3,12,3); hr(13,0,6,4); hr(9,4,2,4); hr(21,4,2,4); break;
    case 'curly': hr(9,1,14,4); hr(8,3,2,6); hr(22,3,2,6); S(9,1,hc); S(14,0,hc); S(19,0,hc); S(23,2,hc); break;
  }

  if(spec.acc==='shades'){ R(11,10,4,2,'#0a0a0a'); R(17,10,4,2,'#0a0a0a'); R(15,10,2,1,'hairD'); }
  else { S(13,10,'eye'); S(19,10,'eye'); }
  R(15,13,3,1,'hairD');
  if(isF){ S(11,12,'#f7a8a0'); S(21,12,'#f7a8a0'); }

  if(spec.outfit==='suit'){ R(15,19,2,1,'white'); T(15,2,14,4,20,24,'white'); T(15,1,15,2,24,30,spec.tie||'#2f6bff'); }
  if(spec.acc==='crown'){ R(10,1,12,2,'#f5c211'); S(10,0,'#f5c211'); S(13,0,'#f5c211'); S(16,0,'#f5c211'); S(19,0,'#f5c211'); S(21,0,'#f5c211'); }
  if(spec.acc==='camera'){ R(23,24,8,6,'#111'); R(25,25,4,4,'#444'); R(26,26,2,2,'#111'); }
  if(spec.acc==='coat'){ const cw=[24,17,10][coatStage]; R(16-cw/2,17,cw,23,spec.coatC||'#3b2a1a'); R(15,17,2,23,'#251a10'); if(coatStage<2) R(25,24,6,6,'#4a3420'); }

  const img=g.getImageData(0,0,32,48), d=img.data;
  const at=(x,y)=>(x<0||y<0||x>=32||y>=48)?false:d[(y*32+x)*4+3]>200;
  const cp=new Uint8ClampedArray(d);
  for(let y=0;y<48;y++)for(let x=0;x<32;x++){
    if(!at(x,y)) continue;
    const i=(y*32+x)*4;
    if(!at(x,y+1)||!at(x+1,y)){ d[i]=cp[i]*.72; d[i+1]=cp[i+1]*.72; d[i+2]=cp[i+2]*.72; }
    else if(!at(x,y-1)||!at(x-1,y)){ d[i]=Math.min(255,cp[i]*1.28+18); d[i+1]=Math.min(255,cp[i+1]*1.28+18); d[i+2]=Math.min(255,cp[i+2]*1.28+18); }
  }
  g.putImageData(img,0,0);

  const img2=g.getImageData(0,0,32,48), d2=img2.data;
  const at2=(x,y)=>(x<0||y<0||x>=32||y>=48)?false:d2[(y*32+x)*4+3]>200;
  g.fillStyle='#07080d';
  for(let y=0;y<48;y++)for(let x=0;x<32;x++){
    if(at2(x,y)) continue;
    if(at2(x-1,y)||at2(x+1,y)||at2(x,y-1)||at2(x,y+1)) g.fillRect(x,y,1,1);
  }
}

const SCACHE={};
function sprite(key, spec, walk, coat){
  const k=key+'|'+walk+'|'+(coat||0);
  if(!SCACHE[k]){
    const t=document.createElement('canvas'); t.width=32; t.height=48;
    const g=t.getContext('2d'); g.imageSmoothingEnabled=false;
    drawCharG(g, spec, walk, coat);
    SCACHE[k]=t;
  }
  return SCACHE[k];
}

// ================= 角色表 =================
const MALES=[
  {key:'m1', body:'M', hair:'short', hairC:'hairD', outfit:'tee', oc:'#16a34a'},
  {key:'m2', body:'M', hair:'curly', hairC:'hairBk', outfit:'tee', oc:'#2563eb'},
  {key:'m3', body:'M', hair:'bun',   hairC:'hairBr', outfit:'tee', oc:'#dc2626'},
  {key:'m4', body:'M', hair:'bald',  hairC:'hairD', outfit:'tee', oc:'#ca8a04'},
];
const FEMALES=[
  {key:'f1', body:'F', hair:'long',  hairC:'hairBr', outfit:'dress', oc:'#db2777'},
  {key:'f2', body:'F', hair:'bun',   hairC:'hairD',  outfit:'dress', oc:'#7c3aed'},
  {key:'f3', body:'F', hair:'curly', hairC:'hairBk', outfit:'dress', oc:'#0d9488'},
  {key:'f4', body:'F', hair:'short', hairC:'hairBr', outfit:'dress', oc:'#ea580c'},
];
const GUARD_M={key:'gm', body:'M', hair:'short', hairC:'hairD', outfit:'suit', oc:'suit', tie:'#2f6bff', acc:'shades'};
const GUARD_F={key:'gf', body:'F', hair:'long', hairC:'hairBr', outfit:'suit', oc:'suit', tie:'#ff0044', acc:'shades'};
const STAR   ={key:'star', body:'M', hair:'curly', hairC:'hairBk', outfit:'dress', oc:'#8b5cf6', acc:'crown'};
const FATTY  ={key:'fatty', body:'M', hair:'bald', hairC:'hairD', outfit:'tee', oc:'#ca8a04', fat:true};
const PAP    ={key:'pap', body:'M', hair:'short', hairC:'hairD', outfit:'tee', oc:'#374151', acc:'camera'};
const ANDRO  ={key:'andro', body:'F', hair:'short', hairC:'hairD', outfit:'dress', oc:'#f472b6', acc:'coat', coatC:'#3b2a1a'};

// ================= 状态 =================
let state='ready', fans=[], score=0, wave=1;
let starName='小明星';
let guarded=false;
let shake=0, freeze=0, flash=0, screenFlash=0;
let particles=[], popups=[];
let spawnTimer=0, interval=1.2, t=0;

function resize(){
  const dpr=Math.min(devicePixelRatio||1,2);
  const PX=2;
  const gw=Math.floor(innerWidth/PX), gh=Math.floor(innerHeight/PX);
  GW=gw; GH=gh;
  cv.width=gw*PX*dpr; cv.height=gh*PX*dpr;
  cv.style.width=(gw*PX)+'px'; cv.style.height=(gh*PX)+'px';
  ctx.setTransform(PX*dpr,0,0,PX*dpr,0,0);
  ctx.imageSmoothingEnabled=false;
  cx=GW/2;
  guardY=GH*0.54;
  starY=GH*0.70;
  laneHalf=Math.min(GW*0.34, 74);
}

function startGame(){
  state='playing';
  fans=[]; score=0; wave=1; guarded=false;
  shake=0; freeze=0; flash=0; screenFlash=0; particles=[]; popups=[];
  spawnTimer=0.5; interval=1.2; t=0;
  document.getElementById('start').classList.add('hidden');
  document.getElementById('over').classList.add('hidden');
}

// ---- 只从上方 ----
function spawnWave(){
  const r=Math.random();
  if(r<0.10){ spawnFatty(); return; }
  if(r<0.18){ spawnPaparazzi(); return; }
  if(r<0.28){ spawnAndro(); return; }
  spawnNormalGroup();
}
function spawnNormalGroup(){
  const type=Math.random()<0.5?'male':'female';
  const maxN=Math.min(3,1+Math.floor(wave/4));
  const n=1+Math.floor(Math.random()*maxN);
  const pool=type==='male'?MALES:FEMALES;
  const bx=cx+(Math.random()-0.5)*laneHalf*2;
  for(let i=0;i<n;i++){
    fans.push({ type, variant:Math.floor(Math.random()*4), pool,
      x:bx+(i-(n-1)/2)*24, y:-36-i*22,
      speed:0.55+Math.min(0.8,score*0.02)+(wave-1)*0.04, phase:Math.random()*10 });
  }
}
function spawnFatty(){ fans.push({ special:'fatty', type:'male', x:cx+(Math.random()-0.5)*laneHalf, y:-44, speed:0.45, hits:0, rolling:false, rollSpeed:0, phase:0 }); }
function spawnPaparazzi(){ const side=Math.random()<0.5?-1:1; fans.push({ special:'paparazzi', x:cx+side*(laneHalf+16), y:GH*0.36, charge:0, flashed:false }); }
function spawnAndro(){ fans.push({ special:'andro', type:Math.random()<0.5?'male':'female', x:cx+(Math.random()-0.5)*laneHalf, y:-38, speed:0.5, revealed:false, phase:0 }); }

// ---- 更新 ----
function update(dt){
  if(state!=='playing') return;
  t+=dt;
  if(freeze>0){ freeze-=dt; return; }
  const nw=1+Math.floor(score/8);
  if(nw>wave){ wave=nw; interval=Math.max(0.65,interval-0.05); }

  spawnTimer-=dt;
  if(spawnTimer<=0){ spawnWave(); spawnTimer=Math.max(0.65,interval-score*0.006); }

  for(let i=fans.length-1;i>=0;i--){
    const f=fans[i];
    if(f.special==='paparazzi'){
      f.charge+=dt;
      if(f.charge>1.0 && !f.flashed){ f.flashed=true; screenFlash=0.45; beep(1500,0.05); burst(f.x,f.y,'#fff',14); }
      if(f.charge>2.2) fans.splice(i,1);
      continue;
    }
    if(f.rolling){ f.y+=f.rollSpeed*60*dt; if(f.y>GH+40) fans.splice(i,1); continue; }
    f.y += f.speed*60*dt;
    if(f.special==='andro' && !f.revealed && f.y>=guardY-34) f.revealed=true;
    if(f.y >= guardY-6) resolveFan(f);
  }

  if(shake>0.001) shake*=Math.pow(0.001,dt); else shake=0;
  if(flash>0) flash-=dt*3; else flash=0;
  if(screenFlash>0) screenFlash-=dt; else screenFlash=0;

  for(let i=particles.length-1;i>=0;i--){ const p=particles[i]; p.x+=p.vx*dt; p.y+=p.vy*dt; p.vy+=600*dt; p.life-=dt; if(p.life<=0) particles.splice(i,1); }
  for(let i=popups.length-1;i>=0;i--){ const p=popups[i]; p.y-=40*dt; p.life-=dt; if(p.life<=0) popups.splice(i,1); }
}

function resolveFan(f){
  const correct=(f.type==='male'&&guarded)||(f.type==='female'&&!guarded);
  const fx=f.x, fy=guardY-8;
  if(f.special==='fatty'){
    if(correct){
      f.hits++;
      if(f.hits<3){ f.y-=22; shake=.2; flash=.18; burst(fx,fy,'#f59e0b',12); popup(fx,fy-14,'弹回 '+f.hits+'/3','#f59e0b'); beep(660,0.06); }
      else fattyReward(f,fx,fy);
    } else { shake=.35; flash=.25; burst(fx,fy,'#2f6bff',10); beep(200,0.12); const idx=fans.indexOf(f); if(idx>=0) fans.splice(idx,1); }
    return;
  }
  if(correct){
    score++; burst(fx,fy,f.type==='male'?'#2f6bff':'#ff0044',12); popup(fx,fy-12,'+1','#fff'); shake=.12; flash=.1; beep(f.type==='male'?880:1040,0.04);
  } else {
    shake=.9; freeze=.4; flash=1; burst(fx,fy,'#ff0044',30); beep(110,0.3); endGame('闹出绯闻了，这些好友可惨了');
  }
  const idx=fans.indexOf(f); if(idx>=0) fans.splice(idx,1);
}

function fattyReward(f,fx,fy){
  let knocked=0;
  for(let j=fans.length-1;j>=0;j--){
    const o=fans[j]; if(o===f||o.special==='paparazzi'||o.rolling) continue;
    if(Math.abs(o.x-f.x)<40){ knocked++; burst(o.x,o.y,'#fbbf24',10); fans.splice(j,1); }
  }
  score+=knocked+3; f.rolling=true; f.rollSpeed=6;
  shake=.5; flash=.35; popup(fx,fy-20,knocked?`滚回去！撞飞 ${knocked} 个`:'滚回去！','#f59e0b');
  burst(fx,fy,'#fbbf24',20); beep(300,0.2);
}

function endGame(reason){
  state='over';
  document.getElementById('score').textContent=score;
  document.getElementById('overSub').textContent=reason||'';
  document.getElementById('over').classList.remove('hidden');
}
function burst(x,y,color,n){ for(let i=0;i<n;i++){ const a=Math.random()*Math.PI*2,s=40+Math.random()*90; particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-30,life:.5+Math.random()*.4,color,size:1+Math.random()*1.5}); } }
function popup(x,y,text,color){ popups.push({x,y,text,color,life:.9}); }

// ---- 背景 ----
function drawBG(){
  const g=ctx.createLinearGradient(0,0,0,GH);
  g.addColorStop(0,'#171126'); g.addColorStop(.55,'#0e0b18'); g.addColorStop(1,'#07080d');
  ctx.fillStyle=g; ctx.fillRect(0,0,GW,GH);

  // 聚光灯
  for(const dx of [-34,34]){
    const x=cx+dx;
    const lg=ctx.createLinearGradient(x,0,x,GH*.8);
    lg.addColorStop(0,'rgba(255,235,190,.14)'); lg.addColorStop(1,'rgba(255,235,190,0)');
    ctx.fillStyle=lg;
    ctx.beginPath(); ctx.moveTo(x-8,0); ctx.lineTo(x+8,0); ctx.lineTo(x+64,GH*.8); ctx.lineTo(x-64,GH*.8); ctx.closePath(); ctx.fill();
  }
  // 红毯
  ctx.fillStyle='#8e1229';
  ctx.beginPath(); ctx.ellipse(cx, GH*.84, GW*.42, GH*.075, 0,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#a3172f';
  ctx.beginPath(); ctx.ellipse(cx, GH*.84, GW*.30, GH*.05, 0,0,Math.PI*2); ctx.fill();
  // 顶灯
  for(let i=0;i<7;i++){ ctx.fillStyle=i%2?'rgba(251,191,36,.55)':'rgba(56,189,248,.5)'; ctx.beginPath(); ctx.arc(14+i*(GW-28)/6,6,1.5,0,Math.PI*2); ctx.fill(); }
  // 观众
  ctx.fillStyle='rgba(5,5,8,.95)';
  for(let i=0;i<10;i++){ const x=8+i*(GW-16)/9+(i%3)*3, y=GH-6-(i%2)*3; ctx.beginPath(); ctx.arc(x,y,5,0,Math.PI*2); ctx.fill(); ctx.beginPath(); ctx.ellipse(x,y+8,7,5,0,0,Math.PI*2); ctx.fill(); }
}

// ---- 画角色 ----
function put(spec,x,y,scale,walk,coat){
  const img=sprite(spec.key,spec,walk||0,coat||0);
  const w=32*scale,h=48*scale;
  ctx.fillStyle='rgba(0,0,0,.22)';
  ctx.beginPath(); ctx.ellipse(x, y+h*0.5-2, w*0.4, h*0.07, 0,0,Math.PI*2); ctx.fill();
  ctx.drawImage(img, Math.round(x-w/2), Math.round(y-h/2), w, h);
}

function draw(){
  ctx.clearRect(0,0,GW,GH);
  drawBG();

  ctx.save();
  if(shake>0.001){ const s=shake*shake*8; ctx.translate((Math.random()-.5)*s,(Math.random()-.5)*s); }

  // 明星（下方）
  put(STAR, cx, starY, 1.2, 0, 0);
  // 名牌 + 好友头像
  ctx.fillStyle='#111'; ctx.fillRect(cx-24, starY+30, 48, 9);
  ctx.fillStyle='#fbbf24'; ctx.font='bold 6px "Microsoft YaHei"'; ctx.textAlign='center';
  ctx.fillText('★ '+starName, cx, starY+36);
  ctx.fillStyle='#38bdf8'; ctx.beginPath(); ctx.arc(cx-32, starY+8, 7, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle='#fff'; ctx.font='bold 8px "Microsoft YaHei"'; ctx.fillText(starName[0], cx-32, starY+11);

  // 保镖（中间，一左一右，主动的上前）
  const gmy = guarded ? guardY-6 : guardY;
  const gfy = !guarded ? guardY-6 : guardY;
  put(GUARD_M, cx-22, gmy, 1.2, 1, 0);
  put(GUARD_F, cx+22, gfy, 1.2, 3, 0);
  // 盾弧（在保镖前方）
  ctx.save(); ctx.globalAlpha=.55; ctx.strokeStyle=guarded?'#2f6bff':'#ff0044'; ctx.lineWidth=1.6;
  ctx.beginPath(); ctx.arc(cx, guardY-30, 34, Math.PI*1.12, Math.PI*1.88); ctx.stroke(); ctx.restore();

  // 粉丝
  for(const f of fans){
    const walk=Math.floor(t*6+f.phase)%4;
    if(f.special==='paparazzi'){ put(PAP,f.x,f.y,1.1,0,0); continue; }
    if(f.special==='fatty'){
      put(FATTY,f.x,f.y,1.5,0,0);
      ctx.fillStyle='#f59e0b'; ctx.font='bold 7px "Microsoft YaHei"'; ctx.textAlign='center';
      ctx.fillText('重装 '+f.hits+'/3', f.x, f.y-30); continue;
    }
    if(f.special==='andro'){
      let coat=0; if(!f.revealed){ coat = f.y<guardY-22?0 : f.y<guardY-12?1 : 2; } else coat=2;
      put(ANDRO,f.x,f.y,1.2,0,coat);
      if(f.revealed){ ctx.fillStyle=f.type==='male'?'#2f6bff':'#ff0044'; ctx.font='bold 7px "Microsoft YaHei"'; ctx.textAlign='center'; ctx.fillText(f.type==='male'?'男粉':'女粉',f.x,f.y-30); }
      continue;
    }
    put(f.pool[f.variant],f.x,f.y,1.2,walk,0);
    // 类型标记
    ctx.fillStyle=f.type==='male'?'#2f6bff':'#ff0044';
    ctx.beginPath(); ctx.arc(f.x, f.y-30, 2, 0, Math.PI*2); ctx.fill();
  }

  ctx.restore();

  drawParticles(); drawPopups();
  drawCaption(); drawPrompt(); drawScore();

  if(flash>0){ ctx.fillStyle=`rgba(255,0,68,${Math.min(.3,flash*.3)})`; ctx.fillRect(0,0,GW,GH); }
  if(screenFlash>0){ ctx.fillStyle=`rgba(255,255,255,${Math.min(.8,screenFlash*1.8)})`; ctx.fillRect(0,0,GW,GH); }
}

function drawParticles(){ for(const p of particles){ ctx.globalAlpha=Math.max(0,Math.min(1,p.life*3)); ctx.fillStyle=p.color; ctx.fillRect(Math.round(p.x),Math.round(p.y),2,2); } ctx.globalAlpha=1; }
function drawPopups(){ for(const p of popups){ ctx.globalAlpha=Math.max(0,Math.min(1,p.life*3)); ctx.fillStyle=p.color; ctx.font='bold 8px "Microsoft YaHei"'; ctx.textAlign='center'; ctx.fillText(p.text,Math.round(p.x),Math.round(p.y)); } ctx.globalAlpha=1; }
function drawCaption(){ ctx.fillStyle='#e5e7eb'; ctx.font='bold 7px "Microsoft YaHei"'; ctx.textAlign='center'; ctx.fillText(`帮好友挡住狂热粉丝`, cx, 12); }
function drawPrompt(){
  if(!fans.length) return;
  let u=null,best=1e9;
  for(const f of fans){ if(f.special==='paparazzi'||f.rolling) continue; if(f.y>best){} if(GH-f.y<best){ best=GH-f.y; u=f; } }
  if(!u) return;
  const text=u.type==='male'?'按住！':'松开！';
  ctx.fillStyle='#fff'; ctx.font='bold 14px "Microsoft YaHei"'; ctx.textAlign='center';
  ctx.fillText(text, cx, 30);
  ctx.fillStyle=u.type==='male'?'#2f6bff':'#ff0044';
  ctx.fillRect(cx-20, 34, 40, 2);
}
function drawScore(){ ctx.fillStyle='#fff'; ctx.font='bold 15px "Microsoft YaHei"'; ctx.textAlign='left'; ctx.fillText(String(score), 6, 24); ctx.fillStyle='#ff5c85'; ctx.font='bold 6px "Microsoft YaHei"'; ctx.fillText('WAVE '+wave, 6, 32); }

// ---- 音效 ----
let audioCtx=null;
function beep(freq,dur){ try{ if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)(); const o=audioCtx.createOscillator(),g=audioCtx.createGain(); o.frequency.value=freq; o.type='square'; g.gain.value=.03; o.connect(g); g.connect(audioCtx.destination); o.start(); g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+dur); o.stop(audioCtx.currentTime+dur); }catch(e){} }

// ---- 输入 ----
function down(){ if(state==='playing'){ guarded=true; beep(520,.03); } }
function up(){ if(state==='playing'){ guarded=false; beep(440,.03); } }
cv.addEventListener('pointerdown',down);
window.addEventListener('pointerup',up);
window.addEventListener('pointercancel',up);

// ---- 循环 ----
let last=performance.now();
function loop(){ const now=performance.now(); const dt=Math.min(.05,(now-last)/1000); last=now; update(dt); draw(); requestAnimationFrame(loop); }

addEventListener('resize',resize);
document.getElementById('btnStart').onclick=startGame;
document.getElementById('btnAgain').onclick=startGame;
resize();
loop();
</script>
