<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>堆高高</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#070a12;font-family:"Microsoft YaHei",sans-serif;touch-action:none}
  #cv{display:block;position:fixed;inset:0}
  .panel{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center;background:radial-gradient(circle at 50% 30%,#15203a,#05070f 70%);z-index:10}
  .hidden{display:none}
  h1{font-size:32px;margin:0;letter-spacing:2px}
  .sub{color:#94a3b8;font-size:14px;line-height:1.8}
  .big{font-size:52px;font-weight:bold;color:#fbbf24;text-shadow:0 0 30px rgba(251,191,36,.4)}
  button{padding:14px 32px;font-size:18px;border-radius:14px;border:0;background:linear-gradient(135deg,#e11d48,#be123c);color:#fff;font-weight:bold;cursor:pointer;box-shadow:0 8px 24px rgba(225,29,72,.35)}
  button.ghost{background:#1f2937;box-shadow:none}
  #toast{position:fixed;left:50%;top:16px;transform:translateX(-50%);background:#111827;border:1px solid #334155;border-radius:999px;padding:8px 16px;font-size:13px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:20}
  #toast.show{opacity:1}
</style>
</head>
<body>
<canvas id="cv"></canvas>

<div id="start" class="panel">
  <h1>🧱 堆高高</h1>
  <div class="sub">方块左右滑动，点屏幕放下。<br>对得越准越稳；完美重叠有连击加成！</div>
  <button id="btnStart">开始</button>
</div>

<div id="over" class="panel hidden">
  <div class="sub">你的高度</div>
  <div class="big" id="score">0</div>
  <button id="btnAgain">再来一局</button>
  <button id="btnShare" class="ghost">保存成绩图</button>
</div>

<div id="toast"></div>

<script>
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
let W, H, DPR;
const BLOCK_H = 26;
let tower = [], moving = null, combo = 0, score = 0, state = 'start', perfectFlash = 0, shake = 0;
let particles = [];

const COLORS = ['#38bdf8','#a78bfa','#34d399','#fbbf24','#fb7185','#f472b6'];

function resize() {
  DPR = Math.min(devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight;
  cv.width = W * DPR; cv.height = H * DPR;
  cv.style.width = W + 'px'; cv.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}

function baseW() { return Math.min(W * 0.55, 220); }

function reset() {
  tower = [{ x: (W - baseW()) / 2, w: baseW() }];
  combo = 0; score = 0; perfectFlash = 0; shake = 0; particles = [];
  state = 'playing';
  spawnMoving();
  document.getElementById('start').classList.add('hidden');
  document.getElementById('over').classList.add('hidden');
}

function spawnMoving() {
  const top = tower[tower.length - 1];
  const speed = 1.8 + Math.min(4.6, score * 0.12);
  moving = { x: 0, w: top.w, dir: 1, speed };
}

function update() {
  if (state !== 'playing' || !moving) return;
  moving.x += moving.dir * moving.speed;
  if (moving.x <= 0) { moving.x = 0; moving.dir = 1; }
  if (moving.x + moving.w >= W) { moving.x = W - moving.w; moving.dir = -1; }
  if (perfectFlash > 0) perfectFlash--;
  if (shake > 0.001) shake *= 0.88; else shake = 0;
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx; p.y += p.vy; p.vy += 0.18; p.life--;
    if (p.life <= 0) particles.splice(i, 1);
  }
}

function drop() {
  if (state !== 'playing' || !moving) return;
  const top = tower[tower.length - 1];
  const left = Math.max(top.x, moving.x);
  const right = Math.min(top.x + top.w, moving.x + moving.w);
  const overlap = right - left;
  if (overlap <= 0) { gameOver(); return; }
  const dx = Math.abs(moving.x - top.x);
  const y = H - 70 - (tower.length + 1) * BLOCK_H;
  if (dx < 6) {
    tower.push({ x: top.x, w: top.w });
    combo++; score += 2 + combo; perfectFlash = 36;
    burst(moving.x + moving.w / 2, y, 18, ['#fbbf24','#fff2b0']);
    shake = 0.12;
  } else {
    tower.push({ x: left, w: overlap });
    combo = 0; score += 1;
    burst(left + overlap / 2, y, 6, ['#94a3b8']);
    if (overlap < top.w * 0.5) shake = 0.18;
  }
  spawnMoving();
}

function burst(x, y, n, colors) {
  for (let i = 0; i < n; i++) {
    particles.push({
      x, y,
      vx: (Math.random() - 0.5) * 7,
      vy: -Math.random() * 6 - 1,
      life: 30 + Math.random() * 20,
      color: colors[Math.floor(Math.random() * colors.length)],
      size: 2 + Math.random() * 3,
    });
  }
}

function gameOver() {
  state = 'over';
  shake = 0.3;
  document.getElementById('score').textContent = score;
  document.getElementById('over').classList.remove('hidden');
}

function draw() {
  ctx.clearRect(0, 0, W, H);
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#0f172a'); g.addColorStop(1, '#05070f');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

  const baseY = H - 70;
  const topLevel = tower.length + 1;
  const offsetY = Math.max(0, 60 - (baseY - topLevel * BLOCK_H));

  ctx.save();
  ctx.translate(0, offsetY + (shake ? (Math.random() - 0.5) * shake * 30 : 0));

  for (let i = 0; i < tower.length; i++) {
    const b = tower[i];
    const y = baseY - (i + 1) * BLOCK_H;
    drawBlock(b.x, y, b.w, COLORS[i % COLORS.length]);
  }
  if (moving) {
    const y = baseY - topLevel * BLOCK_H;
    drawBlock(moving.x, y, moving.w, '#38bdf8', true);
  }
  ctx.restore();

  // particles
  for (const p of particles) {
    ctx.globalAlpha = Math.max(0, p.life / 40);
    ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x, p.y + offsetY, p.size, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = 1;
  }

  // score
  ctx.fillStyle = '#e5e7eb'; ctx.font = 'bold 30px "Microsoft YaHei"'; ctx.textAlign = 'left';
  ctx.fillText(String(score), 22, 48);
  if (combo > 0) {
    ctx.fillStyle = '#fbbf24'; ctx.font = 'bold 15px "Microsoft YaHei"';
    ctx.fillText('连击 x' + combo, 22, 72);
  }
  if (perfectFlash > 0) {
    ctx.fillStyle = `rgba(251,191,36,${perfectFlash / 36})`;
    ctx.font = 'bold 46px "Microsoft YaHei"'; ctx.textAlign = 'center';
    ctx.fillText('完美!', W / 2, H * 0.38);
  }
}

function drawBlock(x, y, w, color, isMoving) {
  ctx.save();
  ctx.shadowColor = 'rgba(0,0,0,.5)';
  ctx.shadowBlur = 10;
  ctx.shadowOffsetY = 4;
  ctx.fillStyle = color;
  ctx.beginPath(); ctx.roundRect(x, y, w, BLOCK_H, 6); ctx.fill();
  ctx.restore();
  ctx.fillStyle = 'rgba(255,255,255,.35)';
  ctx.beginPath(); ctx.roundRect(x + 3, y + 3, w - 6, 5, 3); ctx.fill();
  if (isMoving) {
    ctx.strokeStyle = 'rgba(255,255,255,.75)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.roundRect(x, y, w, BLOCK_H, 6); ctx.stroke();
  }
}

function makeShareCard() {
  const c = document.createElement('canvas');
  c.width = 600; c.height = 800;
  const g = c.getContext('2d');
  const grd = g.createLinearGradient(0, 0, 0, 800);
  grd.addColorStop(0, '#0b1020'); grd.addColorStop(1, '#1e293b');
  g.fillStyle = grd; g.fillRect(0, 0, 600, 800);
  g.fillStyle = '#e5e7eb'; g.font = 'bold 44px "Microsoft YaHei"'; g.textAlign = 'center';
  g.fillText('堆高高', 300, 90);
  g.fillStyle = '#fbbf24'; g.font = 'bold 120px "Microsoft YaHei"';
  g.fillText(String(score), 300, 330);
  g.fillStyle = '#94a3b8'; g.font = '26px "Microsoft YaHei"';
  g.fillText('层', 300, 380);
  // mini tower
  for (let i = 0; i < 8; i++) {
    const w = 120 - i * 10;
    const y = 680 - i * 34;
    g.fillStyle = COLORS[i % COLORS.length];
    g.beginPath(); g.roundRect(300 - w / 2, y, w, 30, 4); g.fill();
  }
  g.fillStyle = '#475569'; g.font = '22px "Microsoft YaHei"';
  g.fillText('来挑战你的手速', 300, 750);
  return c;
}

function loop() { update(); draw(); requestAnimationFrame(loop); }

function tap() {
  if (state === 'start') reset();
  else if (state === 'playing') drop();
}

addEventListener('resize', resize);
cv.addEventListener('pointerdown', tap);
addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); tap(); } });
document.getElementById('btnStart').onclick = reset;
document.getElementById('btnAgain').onclick = reset;
document.getElementById('btnShare').onclick = () => {
  const c = makeShareCard();
  const a = document.createElement('a');
  a.download = '堆高高.png'; a.href = c.toDataURL('image/png'); a.click();
  toast('已保存成绩图');
};
function toast(m) {
  const el = document.getElementById('toast');
  el.textContent = m; el.classList.add('show');
  clearTimeout(window.__tt); window.__tt = setTimeout(() => el.classList.remove('show'), 1500);
}

resize();
loop();
</script>
</body>
</html>
