<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>守卫 GUARD</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#fff;font-family:"Microsoft YaHei",sans-serif;touch-action:none;user-select:none}
  #cv{display:block;position:fixed;inset:0}
  .overlay{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px;text-align:center;z-index:10;background:rgba(255,255,255,.94)}
  .hidden{display:none}
  h1{font-size:44px;margin:0;color:#111;letter-spacing:2px;text-shadow:0 2px 0 #ddd}
  .sub{color:#555;font-size:14px;line-height:1.8}
  button{padding:16px 40px;font-size:19px;border-radius:14px;border:0;background:#111;color:#fff;font-weight:bold;cursor:pointer}
  .big{font-size:56px;font-weight:bold;color:#ff0044}
  #toast{position:fixed;left:50%;top:14px;transform:translateX(-50%);background:#111;color:#fff;border-radius:999px;padding:8px 16px;font-size:13px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:20}
  #toast.show{opacity:1}
</style>
</head>
<body>
<canvas id="cv"></canvas>

<div id="start" class="overlay">
  <h1>GUARD!</h1>
  <div class="sub">
    按住 = 男守卫（挡男粉）<br>
    松开 = 女守卫（挡女粉）<br>
    挡错女粉 → 她起诉骚扰，游戏结束
  </div>
  <button id="btnStart">开始</button>
</div>

<div id="over" class="overlay hidden">
  <div class="sub">挡住的人数</div>
  <div class="big" id="score">0</div>
  <div class="sub" id="overSub"></div>
  <button id="btnAgain">再来一局</button>
</div>

<div id="toast"></div>

<script>
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
let W, H, DPR;
let cx, cy, guardR, spawnR;

let state = 'ready';
let fans = [];
let score = 0;
let guarded = false;          // true = 按住(男守卫)
let maleRot = -Math.PI / 2;   // 男守卫角度
let shake = 0, freeze = 0, flash = 0;
let particles = [];
let popups = [];
let spawnTimer = 0;
let interval = 1.4;
let lastFan = null;
let t = 0;

function resize() {
  DPR = Math.min(devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight;
  cv.width = W * DPR; cv.height = H * DPR;
  cv.style.width = W + 'px'; cv.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  cx = W / 2; cy = H * 0.55;
  guardR = Math.min(W, H) * 0.21;
  spawnR = Math.min(W, H) * 0.78;
}

function startGame() {
  state = 'playing';
  fans = []; score = 0; guarded = false; maleRot = -Math.PI / 2;
  shake = 0; freeze = 0; flash = 0;
  particles = []; popups = [];
  spawnTimer = 0.6; interval = 1.4; lastFan = null; t = 0;
  document.getElementById('start').classList.add('hidden');
  document.getElementById('over').classList.add('hidden');
}

function spawnFan() {
  const type = Math.random() < 0.5 ? 'male' : 'female';
  const angle = -Math.PI / 2 + (Math.random() - 0.5) * 1.6; // 从上方附近来
  fans.push({ type, angle, dist: spawnR, speed: 0.9 + Math.min(2.2, score * 0.06) });
  lastFan = fans[fans.length - 1];
}

function update(dt) {
  if (state !== 'playing') return;
  t += dt;

  // freeze frames (hit-stop)
  if (freeze > 0) { freeze -= dt; return; }

  // spawn
  spawnTimer -= dt;
  if (spawnTimer <= 0 && fans.length === 0) {
    spawnFan();
    spawnTimer = Math.max(0.55, interval - score * 0.02);
  }

  // move fans
  for (let i = fans.length - 1; i >= 0; i--) {
    const f = fans[i];
    f.dist -= f.speed * 60 * dt;
    if (f.dist <= guardR) {
      resolveFan(f);
      fans.splice(i, 1);
    }
  }

  // guard rotation toward active fan
  let front = -Math.PI / 2;
  if (fans.length) front = fans[0].angle;
  const target = guarded ? front : front + Math.PI;
  const diff = Math.atan2(Math.sin(target - maleRot), Math.cos(target - maleRot));
  maleRot += diff * Math.min(1, dt * 12);

  // decay
  if (shake > 0.001) shake *= Math.pow(0.001, dt); else shake = 0;
  if (flash > 0) flash -= dt * 3; else flash = 0;

  // particles
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 900 * dt;
    p.life -= dt;
    if (p.life <= 0) particles.splice(i, 1);
  }
  // popups
  for (let i = popups.length - 1; i >= 0; i--) {
    const p = popups[i];
    p.y -= 70 * dt; p.life -= dt;
    if (p.life <= 0) popups.splice(i, 1);
  }
}

function resolveFan(f) {
  const correct = (f.type === 'male' && guarded) || (f.type === 'female' && !guarded);
  const fx = cx + Math.cos(f.angle) * guardR * 0.5;
  const fy = cy + Math.sin(f.angle) * guardR * 0.5;
  if (correct) {
    score++;
    burst(fx, fy, 'male' === f.type ? '#38bdf8' : '#ff0044', 16);
    popup(fx, fy - 20, '+1', '#111');
    shake = 0.15; flash = 0.15;
    beep(880, 0.05);
  } else {
    if (f.type === 'female') {
      // 女粉挡错 = 游戏结束
      shake = 0.9; freeze = 0.35; flash = 1;
      burst(fx, fy, '#ff0044', 30);
      beep(120, 0.25);
      endGame('她起诉你骚扰了！');
    } else {
      // 男粉硬闯
      shake = 0.4; flash = 0.3;
      burst(fx, fy, '#38bdf8', 12);
      beep(220, 0.1);
    }
  }
}

function endGame(reason) {
  state = 'over';
  document.getElementById('score').textContent = score;
  document.getElementById('overSub').textContent = reason || '';
  document.getElementById('over').classList.remove('hidden');
}

function burst(x, y, color, n) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, s = 120 + Math.random() * 260;
    particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 80, life: 0.5 + Math.random() * 0.4, color, size: 2 + Math.random() * 3 });
  }
}
function popup(x, y, text, color) { popups.push({ x, y, text, color, life: 0.8 }); }

// ---------- 绘制 ----------
function draw() {
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, W, H);

  ctx.save();
  if (shake > 0.001) {
    const s = shake * shake * 18;
    ctx.translate((Math.random() - 0.5) * s, (Math.random() - 0.5) * s);
  }

  drawFloorRing();
  drawShield();
  drawVip();
  drawGuard(maleRot, 'male');
  drawGuard(maleRot + Math.PI, 'female');
  for (const f of fans) drawFan(f);

  ctx.restore();

  drawParticles();
  drawPopups();
  drawPrompt();
  drawScore();

  if (flash > 0) {
    ctx.fillStyle = `rgba(255,0,68,${Math.min(0.35, flash * 0.35)})`;
    ctx.fillRect(0, 0, W, H);
  }
}

function drawFloorRing() {
  ctx.save();
  ctx.strokeStyle = '#e5e7eb'; ctx.lineWidth = 2;
  ctx.setLineDash([6, 8]);
  ctx.beginPath(); ctx.arc(cx, cy, guardR, 0, Math.PI * 2); ctx.stroke();
  ctx.restore();
}

function drawShield() {
  const color = guarded ? '#2f6bff' : '#ff0044';
  ctx.save();
  ctx.globalAlpha = 0.4;
  ctx.strokeStyle = color;
  ctx.lineWidth = 8;
  ctx.beginPath(); ctx.arc(cx, cy, guardR, 0, Math.PI * 2); ctx.stroke();
  ctx.restore();
}

function drawVip() {
  // 三层叠人（致敬原版：黑帽 / 黄衣国王 / 黑西装）
  const figs = [
    { y: cy + 44, color: '#111', kind: 'suit' },
    { y: cy - 18, color: '#f5c211', kind: 'king' },
    { y: cy - 80, color: '#111', kind: 'hat' },
  ];
  for (const f of figs) {
    // 头
    ctx.fillStyle = '#f2c9a0';
    ctx.beginPath(); ctx.arc(cx, f.y - 30, 16, 0, Math.PI * 2); ctx.fill();
    // 身体
    ctx.fillStyle = f.color;
    ctx.beginPath(); ctx.roundRect(cx - 22, f.y - 10, 44, 48, 10); ctx.fill();
    if (f.kind === 'suit') {
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.moveTo(cx, f.y - 8); ctx.lineTo(cx - 9, f.y + 12); ctx.lineTo(cx + 9, f.y + 12); ctx.closePath(); ctx.fill();
    }
    if (f.kind === 'hat') {
      ctx.fillStyle = '#111';
      ctx.beginPath(); ctx.roundRect(cx - 26, f.y - 48, 52, 10, 3); ctx.fill();
      ctx.beginPath(); ctx.roundRect(cx - 16, f.y - 62, 32, 16, 3); ctx.fill();
    }
    if (f.kind === 'king') {
      ctx.fillStyle = '#111';
      ctx.beginPath();
      ctx.moveTo(cx - 16, f.y - 46); ctx.lineTo(cx - 10, f.y - 58); ctx.lineTo(cx - 4, f.y - 46);
      ctx.lineTo(cx + 2, f.y - 58); ctx.lineTo(cx + 8, f.y - 46); ctx.lineTo(cx + 14, f.y - 58);
      ctx.lineTo(cx + 14, f.y - 44); ctx.lineTo(cx - 16, f.y - 44); ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#f5c211';
      ctx.beginPath(); ctx.roundRect(cx + 18, f.y - 52, 8, 32, 4); ctx.fill();
    }
  }
}

function drawGuard(angle, type) {
  const gx = cx + Math.cos(angle) * guardR;
  const gy = cy + Math.sin(angle) * guardR;
  const color = type === 'male' ? '#2f6bff' : '#ff0044';
  ctx.save();
  ctx.translate(gx, gy);
  // 小人
  ctx.fillStyle = color;
  // 头
  ctx.beginPath(); ctx.arc(0, -18, 10, 0, Math.PI * 2); ctx.fill();
  // 身体
  ctx.beginPath(); ctx.roundRect(-9, -6, 18, 22, 5); ctx.fill();
  // 四肢
  ctx.strokeStyle = color; ctx.lineWidth = 4;
  ctx.beginPath(); ctx.moveTo(-9, 2); ctx.lineTo(-20, -6); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(9, 2); ctx.lineTo(20, -6); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(-4, 16); ctx.lineTo(-8, 30); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(4, 16); ctx.lineTo(8, 30); ctx.stroke();
  // 女：裙子
  if (type === 'female') {
    ctx.fillStyle = color;
    ctx.beginPath(); ctx.moveTo(-10, 10); ctx.lineTo(10, 10); ctx.lineTo(16, 32); ctx.lineTo(-16, 32); ctx.closePath(); ctx.fill();
  }
  ctx.restore();
}

function drawFan(f) {
  const fx = cx + Math.cos(f.angle) * f.dist;
  const fy = cy + Math.sin(f.angle) * f.dist;
  const color = f.type === 'male' ? '#2f6bff' : '#ff0044';
  ctx.save();
  ctx.translate(fx, fy);
  ctx.fillStyle = color;
  ctx.beginPath(); ctx.arc(0, -10, 8, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.roundRect(-7, 0, 14, 18, 4); ctx.fill();
  if (f.type === 'female') {
    ctx.beginPath(); ctx.moveTo(-8, 8); ctx.lineTo(8, 8); ctx.lineTo(12, 24); ctx.lineTo(-12, 24); ctx.closePath(); ctx.fill();
  }
  ctx.restore();
}

function drawParticles() {
  for (const p of particles) {
    ctx.globalAlpha = Math.max(0, Math.min(1, p.life * 3));
    ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function drawPopups() {
  for (const p of popups) {
    ctx.globalAlpha = Math.max(0, Math.min(1, p.life * 3));
    ctx.fillStyle = p.color;
    ctx.font = 'bold 22px "Microsoft YaHei"';
    ctx.textAlign = 'center';
    ctx.fillText(p.text, p.x, p.y);
  }
  ctx.globalAlpha = 1;
}

function drawPrompt() {
  if (!fans.length) return;
  const f = fans[0];
  const text = f.type === 'male' ? 'HOLD for HIM!' : 'RELEASE for HER!';
  ctx.fillStyle = '#111';
  ctx.font = 'bold 36px "Microsoft YaHei"';
  ctx.textAlign = 'center';
  const bounce = 1 + Math.sin(t * 10) * 0.04;
  ctx.save();
  ctx.translate(cx, H * 0.18);
  ctx.scale(bounce, bounce);
  ctx.fillText(text, 0, 0);
  ctx.restore();
}

function drawScore() {
  ctx.fillStyle = '#111';
  ctx.font = 'bold 46px "Microsoft YaHei"';
  ctx.textAlign = 'left';
  ctx.fillText(String(score), 24, 60);
}

// ---------- 音效 ----------
let audioCtx = null;
function beep(freq, dur) {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.frequency.value = freq;
    o.type = 'square';
    g.gain.value = 0.04;
    o.connect(g); g.connect(audioCtx.destination);
    o.start();
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
    o.stop(audioCtx.currentTime + dur);
  } catch (e) {}
}

// ---------- 输入 ----------
function pressDown() { if (state === 'playing') { guarded = true; beep(520, 0.03); } }
function pressUp() { if (state === 'playing') { guarded = false; beep(440, 0.03); } }

cv.addEventListener('pointerdown', pressDown);
window.addEventListener('pointerup', pressUp);
cv.addEventListener('pointercancel', pressUp);

// ---------- 主循环 ----------
let last = performance.now();
function loop() {
  const now = performance.now();
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}

addEventListener('resize', resize);
document.getElementById('btnStart').onclick = startGame;
document.getElementById('btnAgain').onclick = startGame;
resize();
loop();
</script>
</body>
</html>
