<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>涂鸦刀</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#070a12;font-family:"Microsoft YaHei",sans-serif;color:#e5e7eb;touch-action:none}
  #cv{display:block;position:fixed;inset:0}
  .hud{position:fixed;left:0;right:0;bottom:0;padding:14px 18px 24px;display:flex;gap:10px;justify-content:center;z-index:10}
  button{padding:14px 28px;font-size:17px;border-radius:14px;border:0;background:linear-gradient(135deg,#e11d48,#be123c);color:#fff;font-weight:bold;cursor:pointer;box-shadow:0 8px 24px rgba(225,29,72,.35)}
  button.ghost{background:#1f2937;box-shadow:none}
  button:disabled{opacity:.35;cursor:not-allowed;box-shadow:none}
  .panel{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center;background:radial-gradient(circle at 50% 30%,#15203a,#05070f 70%);z-index:10}
  .hidden{display:none}
  h1{font-size:32px;margin:0;letter-spacing:2px}
  .sub{color:#94a3b8;font-size:14px;line-height:1.8}
  .big{font-size:44px;font-weight:bold;color:#fbbf24;text-shadow:0 0 30px rgba(251,191,36,.4)}
  #toast{position:fixed;left:50%;top:16px;transform:translateX(-50%);background:#111827;border:1px solid #334155;border-radius:999px;padding:8px 16px;font-size:13px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:20}
  #toast.show{opacity:1}
</style>
</head>
<body>
<canvas id="cv"></canvas>

<div class="hud" id="hud">
  <button id="btnSlash" disabled>开砍！</button>
  <button id="btnClear" class="ghost">重画</button>
</div>

<div id="start" class="panel">
  <h1>🗡️ 涂鸦刀</h1>
  <div class="sub">在屏幕上画一笔，它就是你的武器。<br>画得越长越猛，砍向那只史莱姆。</div>
  <button id="btnStart">开始</button>
</div>

<div id="over" class="panel hidden">
  <div class="big" id="resText"></div>
  <div class="sub" id="resSub"></div>
  <button id="btnAgain">再来一次</button>
  <button id="btnShare" class="ghost">保存结果图</button>
</div>

<div id="toast"></div>

<script>
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
let W, H, DPR;
let points = [], drawing = false, phase = 'ready';
let monsterHp = 100, maxHp = 100, damage = 0, slashT = 0, hitStop = 0, shake = 0;
let particles = [], floatTexts = [], hurtT = 0, deadExplode = 0;

function resize() {
  DPR = Math.min(devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight;
  cv.width = W * DPR; cv.height = H * DPR;
  cv.style.width = W + 'px'; cv.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}

function start() {
  points = []; drawing = false; phase = 'draw';
  monsterHp = maxHp; damage = 0; slashT = 0; hitStop = 0; shake = 0;
  particles = []; floatTexts = []; hurtT = 0; deadExplode = 0;
  document.getElementById('start').classList.add('hidden');
  document.getElementById('over').classList.add('hidden');
  document.getElementById('hud').classList.remove('hidden');
  updateHud();
}

function updateHud() {
  const btn = document.getElementById('btnSlash');
  btn.disabled = phase !== 'draw' || strokeLength() < 30;
}

function strokeLength() {
  let len = 0;
  for (let i = 1; i < points.length; i++) len += Math.hypot(points[i].x - points[i - 1].x, points[i].y - points[i - 1].y);
  return len;
}

cv.addEventListener('pointerdown', e => {
  if (phase !== 'draw') return;
  drawing = true; points = [{ x: e.clientX, y: e.clientY }];
  updateHud();
});
cv.addEventListener('pointermove', e => {
  if (!drawing) return;
  points.push({ x: e.clientX, y: e.clientY });
  updateHud();
});
cv.addEventListener('pointerup', () => { drawing = false; updateHud(); });
cv.addEventListener('pointercancel', () => { drawing = false; updateHud(); });

document.getElementById('btnClear').onclick = () => { if (phase === 'draw') { points = []; updateHud(); } };
document.getElementById('btnStart').onclick = start;
document.getElementById('btnAgain').onclick = start;

document.getElementById('btnSlash').onclick = () => {
  if (phase !== 'draw' || strokeLength() < 30) return;
  damage = Math.min(150, Math.round(strokeLength() / 2.2));
  phase = 'fight'; slashT = 0;
  document.getElementById('btnSlash').disabled = true;
};

function burst(x, y, n, colors) {
  for (let i = 0; i < n; i++) {
    particles.push({
      x, y,
      vx: (Math.random() - 0.5) * 12,
      vy: (Math.random() - 0.5) * 12,
      life: 30 + Math.random() * 30,
      color: colors[Math.floor(Math.random() * colors.length)],
      size: 2 + Math.random() * 4,
    });
  }
}

function applyDamage() {
  monsterHp = Math.max(0, monsterHp - damage);
  hurtT = 30; hitStop = 6; shake = 0.5;
  burst(W / 2, H * 0.38, 24, ['#22c55e', '#86efac', '#fbbf24', '#fff']);
  floatTexts.push({ x: W / 2 + (Math.random() - 0.5) * 60, y: H * 0.32, text: '-' + damage, life: 55 });
  if (monsterHp <= 0) {
    phase = 'over';
    deadExplode = 40;
    burst(W / 2, H * 0.38, 40, ['#22c55e', '#86efac', '#fbbf24']);
    document.getElementById('resText').textContent = '🏆 一刀带走！';
    document.getElementById('resSub').textContent = `伤害 ${damage}，史莱姆被你砍碎了。`;
    document.getElementById('over').classList.remove('hidden');
    document.getElementById('hud').classList.add('hidden');
    window.__res = { win: true, damage };
  } else {
    phase = 'draw';
    updateHud();
  }
}

function drawMonster() {
  const cx = W / 2, cy = H * 0.40;
  const wob = Math.sin(performance.now() / 220) * 4;
  ctx.save();
  // shadow
  ctx.fillStyle = 'rgba(0,0,0,.35)';
  ctx.beginPath(); ctx.ellipse(cx, cy + 150, 120, 22, 0, 0, Math.PI * 2); ctx.fill();
  // body
  const bodyGrad = ctx.createRadialGradient(cx - 40, cy + 20, 20, cx, cy + 60, 150);
  bodyGrad.addColorStop(0, '#86efac');
  bodyGrad.addColorStop(1, '#16a34a');
  ctx.fillStyle = bodyGrad;
  ctx.beginPath();
  ctx.ellipse(cx, cy + 50 + wob, 135, 110, 0, 0, Math.PI * 2);
  ctx.fill();
  // eyes
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.arc(cx - 48, cy + 5, 26, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(cx + 48, cy + 5, 26, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#111';
  if (hurtT > 0) {
    // pained eyes (X)
    ctx.strokeStyle = '#111'; ctx.lineWidth = 6;
    [[cx - 48, cy + 5], [cx + 48, cy + 5]].forEach(([ex, ey]) => {
      ctx.beginPath(); ctx.moveTo(ex - 12, ey - 12); ctx.lineTo(ex + 12, ey + 12); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(ex + 12, ey - 12); ctx.lineTo(ex - 12, ey + 12); ctx.stroke();
    });
  } else {
    ctx.beginPath(); ctx.arc(cx - 42, cy + 10, 11, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(cx + 42, cy + 10, 11, 0, Math.PI * 2); ctx.fill();
  }
  // mouth
  ctx.strokeStyle = '#111'; ctx.lineWidth = 5;
  if (hurtT > 0) {
    ctx.beginPath(); ctx.ellipse(cx, cy + 62, 24, 16, 0, 0, Math.PI * 2); ctx.stroke();
  } else {
    ctx.beginPath(); ctx.arc(cx, cy + 62, 32, 0.15, Math.PI - 0.15); ctx.stroke();
  }
  ctx.restore();
  // hp bar
  const bw = 260, bh = 16, bx = W / 2 - bw / 2, by = cy - 140;
  ctx.fillStyle = '#1e293b'; ctx.beginPath(); ctx.roundRect(bx, by, bw, bh, 8); ctx.fill();
  const hpGrad = ctx.createLinearGradient(bx, 0, bx + bw, 0);
  hpGrad.addColorStop(0, '#ef4444'); hpGrad.addColorStop(1, '#f97316');
  ctx.fillStyle = hpGrad;
  ctx.beginPath(); ctx.roundRect(bx, by, bw * (monsterHp / maxHp), bh, 8); ctx.fill();
  ctx.fillStyle = '#e5e7eb'; ctx.font = '13px "Microsoft YaHei"'; ctx.textAlign = 'center';
  ctx.fillText(`史莱姆 ${monsterHp}/${maxHp}`, W / 2, by - 9);
}

function drawStroke() {
  if (points.length < 2) return;
  ctx.save();
  ctx.strokeStyle = '#38bdf8'; ctx.lineWidth = 6; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.shadowColor = '#38bdf8'; ctx.shadowBlur = 16;
  ctx.beginPath(); ctx.moveTo(points[0].x, points[0].y);
  for (let i = 1; i < points.length; i++) ctx.lineTo(points[i].x, points[i].y);
  ctx.stroke();
  ctx.restore();
}

function draw() {
  ctx.clearRect(0, 0, W, H);
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#0f172a'); g.addColorStop(1, '#05070f');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

  ctx.save();
  if (shake > 0.001) ctx.translate((Math.random() - 0.5) * shake * 30, (Math.random() - 0.5) * shake * 30);

  drawMonster();
  if (phase === 'draw' || phase === 'ready') drawStroke();

  // slash animation
  if (phase === 'fight') {
    slashT++;
    const t = Math.min(1, slashT / 16);
    const x0 = W * 0.08, y0 = H * 0.12, x1 = W * 0.92, y1 = H * 0.78;
    const ex = x0 + (x1 - x0) * t, ey = y0 + (y1 - y0) * t;
    ctx.save();
    ctx.strokeStyle = `rgba(255,255,255,${0.95 * (1 - t * 0.3)})`;
    ctx.lineWidth = 10; ctx.lineCap = 'round';
    ctx.shadowColor = '#fff'; ctx.shadowBlur = 24;
    ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(ex, ey); ctx.stroke();
    ctx.restore();
    if (t >= 1 && slashT >= 20) { applyDamage(); slashT = 0; }
  }

  // particles
  for (const p of particles) {
    p.x += p.vx; p.y += p.vy; p.vy += 0.4; p.life--;
    ctx.globalAlpha = Math.max(0, p.life / 40);
    ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = 1;
  }
  particles = particles.filter(p => p.life > 0);

  // float texts
  for (const f of floatTexts) {
    f.y -= 1.4; f.life--;
    ctx.globalAlpha = Math.max(0, f.life / 55);
    ctx.fillStyle = '#fbbf24'; ctx.font = 'bold 40px "Microsoft YaHei"'; ctx.textAlign = 'center';
    ctx.strokeStyle = '#000'; ctx.lineWidth = 6;
    ctx.strokeText(f.text, f.x, f.y); ctx.fillText(f.text, f.x, f.y);
    ctx.globalAlpha = 1;
  }
  floatTexts = floatTexts.filter(f => f.life > 0);

  ctx.restore();

  if (hurtT > 0) hurtT--;
  if (hitStop > 0) hitStop--;
  if (shake > 0.001) shake *= 0.86; else shake = 0;

  if (phase === 'draw' && points.length < 2) {
    ctx.fillStyle = '#64748b'; ctx.font = '15px "Microsoft YaHei"'; ctx.textAlign = 'center';
    ctx.fillText('按住屏幕，画一笔你的刀', W / 2, H * 0.84);
  }
}

function makeShareCard() {
  const c = document.createElement('canvas');
  c.width = 600; c.height = 800;
  const g = c.getContext('2d');
  const grd = g.createLinearGradient(0, 0, 0, 800);
  grd.addColorStop(0, '#0b1020'); grd.addColorStop(1, '#1e293b');
  g.fillStyle = grd; g.fillRect(0, 0, 600, 800);
  g.fillStyle = '#e5e7eb'; g.font = 'bold 44px "Microsoft YaHei"'; g.textAlign = 'center';
  g.fillText('涂鸦刀', 300, 96);
  // slime
  g.fillStyle = '#22c55e';
  g.beginPath(); g.ellipse(300, 360, 110, 90, 0, 0, Math.PI * 2); g.fill();
  g.fillStyle = '#fff';
  g.beginPath(); g.arc(260, 340, 20, 0, Math.PI * 2); g.fill();
  g.beginPath(); g.arc(340, 340, 20, 0, Math.PI * 2); g.fill();
  g.fillStyle = '#111';
  g.beginPath(); g.arc(260, 344, 9, 0, Math.PI * 2); g.fill();
  g.beginPath(); g.arc(340, 344, 9, 0, Math.PI * 2); g.fill();
  g.fillStyle = '#fbbf24'; g.font = 'bold 90px "Microsoft YaHei"';
  g.fillText(String(damage), 300, 560);
  g.fillStyle = '#94a3b8'; g.font = '26px "Microsoft YaHei"';
  g.fillText('点伤害', 300, 600);
  g.fillStyle = '#475569'; g.font = '22px "Microsoft YaHei"';
  g.fillText('画一笔，砍一刀', 300, 740);
  return c;
}

function loop() {
  if (hitStop <= 0) {
    // no state update needed besides draw
  }
  draw();
  requestAnimationFrame(loop);
}

addEventListener('resize', resize);
document.getElementById('btnShare').onclick = () => {
  const c = makeShareCard();
  const a = document.createElement('a');
  a.download = '涂鸦刀.png'; a.href = c.toDataURL('image/png'); a.click();
  toast('已保存结果图');
};
function toast(m) {
  const el = document.getElementById('toast');
  el.textContent = m; el.classList.add('show');
  clearTimeout(window.__tt); window.__tt = setTimeout(() => el.classList.remove('show'), 1500);
}

resize();
loop();
</script>
</body>
</html>
