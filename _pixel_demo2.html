<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pixel Art v2 · 人物设计</title>
<style>
  body{margin:0;background:#0d1018;color:#e5e7eb;font-family:"Microsoft YaHei",monospace;display:flex;flex-direction:column;align-items:center;padding:14px}
  h2{font-size:15px;margin:2px 0 4px;font-weight:normal;color:#94a3b8}
  .sub{font-size:11px;color:#475569;margin-bottom:10px}
  canvas{image-rendering:pixelated;background:#151a26;border-radius:12px}
  .bar{display:flex;gap:8px;margin:10px 0}
  button{padding:7px 14px;border-radius:8px;border:1px solid #334155;background:#1e293b;color:#e5e7eb;font-size:12px;cursor:pointer}
  button.on{background:#38bdf8;color:#001018;border-color:#38bdf8}
  .legend{font-size:11px;color:#64748b;margin-top:8px;text-align:center;line-height:1.8}
</style>
</head>
<body>
<h2>PIXEL ART v2 · 16×24 · 左上光源 · 3 阶色 · 1px 描边</h2>
<div class="sub">按「角色设计」原则重画：小头 / 梯形躯干 / 负空间 / 有描边 / 有明暗</div>
<canvas id="cv" width="600" height="430"></canvas>
<div class="bar">
  <button id="btnSil">剪影测试</button>
  <button id="btnWalk">走路动画</button>
</div>
<div class="legend">剪影测试：全黑填充后，还能一眼分出「保镖 / 粉丝 / 明星」吗？</div>

<script>
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
ctx.imageSmoothingEnabled = false;

// 3 阶调色板（base / light / shadow）
const PAL = {
  H: { b:'#2b2b2b', l:'#4a4a4a', s:'#141414' }, // 头发
  S: { b:'#f2c9a0', l:'#ffe0c0', s:'#c99a70' }, // 皮肤
  B: { b:'#20242e', l:'#3a4152', s:'#10131a' }, // 西装
  W: { b:'#ffffff', l:'#ffffff', s:'#cdd3dd' }, // 衬衫
  T: { b:'#2f6bff', l:'#6e9bff', s:'#1d45b8' }, // 领带蓝
  R: { b:'#ff0044', l:'#ff5f88', s:'#b30030' }, // 红
  K: { b:'#0a0a0a', l:'#242424', s:'#000000' }, // 黑（墨镜/鞋）
  Y: { b:'#f5c211', l:'#ffe066', s:'#b58a00' }, // 金
  G: { b:'#22c55e', l:'#4ade80', s:'#15803d' }, // 绿
  P: { b:'#8b5cf6', l:'#b794ff', s:'#5b21b6' }, // 紫
};
const OUTLINE = '#07080d';

function renderChar(grid) {
  const h = grid.length, w = grid[0].length;
  const off = document.createElement('canvas');
  off.width = w + 2; off.height = h + 2;
  const g = off.getContext('2d');
  g.imageSmoothingEnabled = false;

  const at = (r, c) => (r < 0 || r >= h || c < 0 || c >= w) ? '.' : grid[r][c];

  // 1) 底色
  for (let r = 0; r < h; r++) for (let c = 0; c < w; c++) {
    const m = grid[r][c];
    if (m === '.') continue;
    g.fillStyle = PAL[m].b;
    g.fillRect(c + 1, r + 1, 1, 1);
  }
  // 2) 明暗：上/左亮，下/右暗
  for (let r = 0; r < h; r++) for (let c = 0; c < w; c++) {
    const m = grid[r][c];
    if (m === '.') continue;
    const up = at(r - 1, c), dn = at(r + 1, c), lf = at(r, c - 1), rt = at(r, c + 1);
    if (dn === '.' || rt === '.') { g.fillStyle = PAL[m].s; g.fillRect(c + 1, r + 1, 1, 1); }
    else if (up === '.' || lf === '.') { g.fillStyle = PAL[m].l; g.fillRect(c + 1, r + 1, 1, 1); }
  }
  // 3) 描边
  g.fillStyle = OUTLINE;
  for (let r = -1; r <= h; r++) for (let c = -1; c <= w; c++) {
    if (at(r, c) !== '.') continue;
    if (at(r - 1, c) !== '.' || at(r + 1, c) !== '.' || at(r, c - 1) !== '.' || at(r, c + 1) !== '.') {
      g.fillRect(c + 1, r + 1, 1, 1);
    }
  }
  return off;
}

// ========== 角色 ==========
// 男保镖：小头、梯形肩、负空间、墨镜只占 2px
const GUARD_M = [
"................",
".....HHHHHH.....",
"....HHHHHHHH....",
"....HSSSSSSH....",
"....HSKSSKSH....",
"....HSSSSSSH....",
".....SSSSSS.....",
"....BBBBBBBB....",
"...BBBBBBBBBB...",
"..BBBBBBBBBBBB..",
"..BBWWWWWWWWBB..",
"..BBWWWTTWWWBB..",
"..BBWWWTTWWWBB..",
"..BBWWWWWWWWBB..",
"..BBBBBBBBBBBB..",
"...BBBBBBBBBB...",
"....BBBBBBBB....",
".....BB..BB.....",
".....BB..BB.....",
".....BB..BB.....",
".....BB..BB.....",
"....KKK..KKK....",
"....KKK..KKK....",
"................",
];
// 走路：右腿前、左腿后
const GUARD_W1 = [
"................",
".....HHHHHH.....",
"....HHHHHHHH....",
"....HSSSSSSH....",
"....HSKSSKSH....",
"....HSSSSSSH....",
".....SSSSSS.....",
"....BBBBBBBB....",
"...BBBBBBBBBB...",
"..BBBBBBBBBBBB..",
"..BBWWWWWWWWBB..",
"..BBWWWTTWWWBB..",
"..BBWWWTTWWWBB..",
"..BBWWWWWWWWBB..",
"..BBBBBBBBBBBB..",
"...BBBBBBBBBB...",
"....BBBBBBBB....",
"....BB....BB....",
"...BB......BB...",
"..BB........BB..",
"..BB........BB..",
".KKK........KKK.",
".KKK........KKK.",
"................",
];

// 女保镖：长发轮廓 + 红领带
const GUARD_F = [
"...HHHHHHHHHH...",
"..HHHHHHHHHHHH..",
"..HHHSSSSSSHHH..",
"..HHHSKSSKSHHH..",
"..HHHSSSSSSHHH..",
"...HHSSSSSSHH...",
"....HSSSSSSH....",
"....BBBBBBBB....",
"...BBBBBBBBBB...",
"..BBBBBBBBBBBB..",
"..BBWWWWWWWWBB..",
"..BBWWWRRWWWBB..",
"..BBWWWRRWWWBB..",
"..BBWWWWWWWWBB..",
"..BBBBBBBBBBBB..",
"...BBBBBBBBBB...",
"....BBBBBBBB....",
".....BB..BB.....",
".....BB..BB.....",
".....BB..BB.....",
".....BB..BB.....",
"....KKK..KKK....",
"....KKK..KKK....",
"................",
];

// 男粉丝：举手 + 绿T恤
const FAN_M = [
"................",
".....HHHHHH.....",
"....HHHHHHHH....",
"....HSSSSSSH....",
"....HSKSSKSH....",
"....HSSSSSSH....",
".....SSSSSS.....",
"..S..GGGGGG..S..",
".SS.GGGGGGGG.SS.",
".SS.GGGGGGGG.SS.",
"..S.GGGGGGGG.S..",
"....GGGGGGGG....",
"....GGGGGGGG....",
"....GGGGGGGG....",
"....GGGGGGGG....",
".....GG..GG.....",
".....GG..GG.....",
".....GG..GG.....",
".....GG..GG.....",
".....GG..GG.....",
"....KKK..KKK....",
"....KKK..KKK....",
"................",
"................",
];

// 女粉丝：裙子轮廓 + 举手
const FAN_F = [
"....HHHHHHHH....",
"...HHHHHHHHHH...",
"...HSSSSSSSSH...",
"...HSKSSSSKSH...",
"...HSSSSSSSSH...",
"....SSSSSSSS....",
"..S..RRRRRR..S..",
".SS.RRRRRRRR.SS.",
".SS.RRRRRRRR.SS.",
"..S.RRRRRRRR.S..",
"....RRRRRRRR....",
"....RRRRRRRR....",
"...RRRRRRRRRR...",
"...RRRRRRRRRR...",
"..RRRRRRRRRRRR..",
"..RRRRRRRRRRRR..",
"................",
"................",
"................",
"................",
"................",
"................",
"................",
"................",
];

// 明星：金冠 + 紫衣 + 墨镜
const STAR = [
"....Y..YY..Y....",
"...YYYYYYYYYY...",
".....HHHHHH.....",
"....HHHHHHHH....",
"....HSSSSSSH....",
"....HSKSSKSH....",
"....HSSSSSSH....",
".....SSSSSS.....",
"....PPPPPPPP....",
"...PPPPPPPPPP...",
"..PPPPPPPPPPPP..",
"..PPWWWWWWWWPP..",
"..PPWWWYYWWWPP..",
"..PPWWWYYWWWPP..",
"..PPWWWWWWWWPP..",
"..PPPPPPPPPPPP..",
"...PPPPPPPPPP...",
"....PPPPPPPP....",
".....PP..PP.....",
".....PP..PP.....",
".....PP..PP.....",
"....KKK..KKK....",
"....KKK..KKK....",
"................",
];

// 渲染缓存
const CACHE = {};
function getSprite(key, grid) {
  if (!CACHE[key]) CACHE[key] = renderChar(grid);
  return CACHE[key];
}

let silhouette = false;
let walking = false;
let walkFrame = 0;
let walkTimer = 0;
const SCALE = 7;

function drawSprite(key, grid, x, y) {
  const img = getSprite(key, grid);
  if (silhouette) {
    // 剪影：把图变成纯黑
    const tmp = document.createElement('canvas');
    tmp.width = img.width; tmp.height = img.height;
    const g = tmp.getContext('2d');
    g.drawImage(img, 0, 0);
    g.globalCompositeOperation = 'source-in';
    g.fillStyle = '#000';
    g.fillRect(0, 0, tmp.width, tmp.height);
    ctx.drawImage(tmp, x, y, img.width * SCALE, img.height * SCALE);
  } else {
    ctx.drawImage(img, x, y, img.width * SCALE, img.height * SCALE);
  }
}

function draw() {
  ctx.clearRect(0, 0, cv.width, cv.height);
  // 网格背景
  ctx.strokeStyle = 'rgba(255,255,255,.035)';
  for (let x = 0; x < cv.width; x += SCALE) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, cv.height); ctx.stroke(); }
  for (let y = 0; y < cv.height; y += SCALE) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(cv.width, y); ctx.stroke(); }

  const y0 = 26;
  // 5 个角色
  drawSprite('gm', GUARD_M, 18, y0);
  drawSprite('gf', GUARD_F, 140, y0);
  drawSprite('fm', FAN_M, 262, y0);
  drawSprite('ff', FAN_F, 384, y0);
  drawSprite('st', STAR, 506-18, y0);

  // 走路动画
  const wx = 18, wy = 250;
  const grid = (Math.floor(walkFrame) % 2 === 0) ? GUARD_M : GUARD_W1;
  const bob = (Math.floor(walkFrame) % 2 === 0) ? 0 : -2;
  if (!silhouette) {
    // 只在非剪影时画走路
    drawSprite('gw', grid, wx, wy + bob);
    ctx.fillStyle = '#94a3b8'; ctx.font = '12px monospace'; ctx.textAlign = 'left';
    ctx.fillText('走路动画（左：接触 右：passing）', wx, wy + 200);
  }
}

function loop(ts) {
  if (walking) {
    if (!loop._last) loop._last = ts;
    walkTimer += ts - loop._last;
    loop._last = ts;
    if (walkTimer > 150) { walkTimer = 0; walkFrame++; }
  } else {
    loop._last = ts;
  }
  draw();
  requestAnimationFrame(loop);
}

document.getElementById('btnSil').onclick = (e) => {
  silhouette = !silhouette;
  e.target.classList.toggle('on', silhouette);
};
document.getElementById('btnWalk').onclick = (e) => {
  walking = !walking;
  e.target.classList.toggle('on', walking);
  if (!walking) { walkFrame = 0; walkTimer = 0; }
};

requestAnimationFrame(loop);
</script>
</body>
</html>
